[project]
name = "migratory"
version = "0.1.0"
description = "Simple migrations CLI tool"
authors = [
    {name = "LightSage",email = "lightsage01@gmail.com"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "typer (>=0.26.5,<0.27.0)",
]

[project.scripts]
migratory = "migratory.main:parser"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
